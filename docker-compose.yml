services:
  db:
    image: postgis/postgis:17-3.5
    container_name: fields-geo-db
    environment:
      POSTGRES_USER: fields
      POSTGRES_PASSWORD: fields
      POSTGRES_DB: fields
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # runs once, on the first start with an empty volume
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fields -d fields"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
